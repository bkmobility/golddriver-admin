<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>골드대리운전 관리자</title>
<link rel="stylesheet" href="css/admin.css">
</head><body>
<div id="login" class="loginwrap" hidden>
  <form id="lform" class="lbox">
    <div class="lg"><i>G</i>골드대리운전</div>
    <h1>관리자 로그인</h1>
    <input id="em" type="email" placeholder="이메일" autocomplete="username" required>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <button class="btn" type="submit">로그인</button>
    <div id="lerr" class="err"></div>
  </form>
</div>
<div id="main" hidden>
  <header>
    <div class="lg"><i>G</i>골드대리운전 <small>관리자</small></div>
    <nav id="tabs"></nav>
    <div class="who"><span id="who"></span><button class="btn sm line" id="logout">로그아웃</button></div>
  </header>
  <main id="view"></main>
</div>
<div id="drawer" class="drawer" hidden></div>
<div id="modal" class="modalbg" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="js/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body></html>
